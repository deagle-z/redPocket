<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>离线模式</title>
    <link href="./fonts/montserrat/montserrat.css" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(640px 420px at 50% 24%, rgba(200, 16, 46, 0.22), transparent 62%),
          radial-gradient(560px 360px at 58% 38%, rgba(255, 215, 0, 0.08), transparent 64%),
          linear-gradient(180deg, #060608 0%, #08080b 58%, #050507 100%);
        color: #f5f5f7;
        font-family: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        padding: 24px;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      p {
        margin: 0;
        color: rgba(245, 245, 247, 0.72);
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>当前网络不可用</h1>
      <p>请检查网络连接后重新打开页面。</p>
    </main>
  </body>
</html>
